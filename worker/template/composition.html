<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>${title}</title>
    <link rel="stylesheet" href="vendor/fonts.css" />
    <script src="vendor/gsap-3.14.2.min.js"></script>
    <style>
      /* Structure only. Every colour, size, position and style comes from this ad's design (design.py), below. */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { position: relative; width: 1080px; height: 1920px; font-family: Montserrat, "Arial Black", sans-serif; }
      #a-roll { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform-origin: 50% 38%; }

      #headline { position: absolute; left: 70px; right: 70px; display: flex; justify-content: center; }
      #headline .box { text-align: center; line-height: 1.16; letter-spacing: -0.01em; }

      .cap { position: absolute; left: 30px; right: 30px; text-align: center; white-space: nowrap;
        font-weight: 900; line-height: 1.1; }
      .w { position: relative; display: inline-block; margin: 0 20px; }
      .w .b, .w .y { color: var(--paper); }
      .w .y { position: absolute; left: 0; top: 0; color: var(--accent); opacity: 0; }
      .w .p { position: absolute; left: -10px; right: -10px; top: 2px; bottom: 2px; display: flex; align-items: center;
        justify-content: center; background: var(--accent); color: var(--on-accent); border-radius: 12px; opacity: 0;
        box-shadow: 0 6px 18px rgba(0,0,0,.4); }

      .co { position: absolute; width: 620px; display: flex; flex-direction: column; align-items: center;
        transform-origin: 50% 100%; }
      .co .arrow { width: 130px; height: 150px; margin-bottom: -8px; }
      .co .scr { margin-top: -6px; }
      .co-box { text-align: center; }

      #cta { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; text-align: center; }
      #cta .line { line-height: 1.15; text-align: center; }

      ${design_css}
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="${total}" data-width="1080" data-height="1920">
      <video id="a-roll" class="clip" src="body.mp4" muted playsinline data-start="0" data-duration="${total}" data-track-index="0"></video>
      <audio id="a-roll-audio" src="body.mp4" data-start="0" data-duration="${total}" data-track-index="9" data-volume="1"></audio>
      <div id="headline" class="clip" data-start="0" data-duration="${body}" data-track-index="1">${headline_html}</div>
      ${elements}
      <div id="cta" class="clip" data-start="${cta_start}" data-duration="${cta_dur}" data-track-index="4">
        ${end_html}
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      ${headline_motion}
      ${timeline}
      tl.fromTo("#cta", {opacity: 0}, {opacity: 1, duration: 0.3}, ${cta_start});
      ${end_motion}
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
